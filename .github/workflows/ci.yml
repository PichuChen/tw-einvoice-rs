name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - run: cargo +1.88.0 check --locked --workspace --all-targets

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo audit --file Cargo.lock
      - name: Install OWASP CycloneDX Cargo plugin
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate reproducible CycloneDX SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tw-einvoice-rs:ci .
      - run: docker run --rm tw-einvoice-rs:ci --help
