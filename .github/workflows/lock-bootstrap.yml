name: TEMP lock bootstrap

on:
  push:
    branches:
      - feat/supply-chain

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supply-chain
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh Cargo.lock
        run: cargo update -p zip
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for zip 9"
          git push origin HEAD:feat/supply-chain
